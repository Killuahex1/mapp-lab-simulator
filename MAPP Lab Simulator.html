S8 4978\n#define REST     10\n\n//musical notation of Pirates of the Caribbean \nconst static int Caribbean[] = { \n NOTE_E4, NOTE_G4, NOTE_A4, NOTE_A4, REST,\n  NOTE_A4, NOTE_B4, NOTE_C5, NOTE_C5, REST,\n  NOTE_C5, NOTE_D5, NOTE_B4, NOTE_B4, REST,\n  NOTE_A4, NOTE_G4, NOTE_A4, REST,\n  \n  NOTE_E4, NOTE_G4, NOTE_A4, NOTE_A4, REST,\n  NOTE_A4, NOTE_B4, NOTE_C5, NOTE_C5, REST,\n  NOTE_C5, NOTE_D5, NOTE_B4, NOTE_B4, REST,\n  NOTE_A4, NOTE_G4, NOTE_A4, REST,\n  \n  NOTE_E4, NOTE_G4, NOTE_A4, NOTE_A4, REST,\n  NOTE_A4, NOTE_C5, NOTE_D5, NOTE_D5, REST,\n  NOTE_D5, NOTE_E5, NOTE_F5, NOTE_F5, REST,\n  NOTE_E5, NOTE_D5, NOTE_E5, NOTE_A4, REST,\n  \n  NOTE_A4, NOTE_B4, NOTE_C5, NOTE_C5, REST,\n  NOTE_D5, NOTE_E5, NOTE_A4, REST,\n  NOTE_A4, NOTE_C5, NOTE_B4, NOTE_B4, REST,\n  NOTE_C5, NOTE_A4, NOTE_B4, REST,\n  \n  NOTE_A4, NOTE_A4,\n  //Repeat of first part\n  NOTE_A4, NOTE_B4, NOTE_C5, NOTE_C5, REST,\n  NOTE_C5, NOTE_D5, NOTE_B4, NOTE_B4, REST,\n  NOTE_A4, NOTE_G4, NOTE_A4, REST,\n  \n  NOTE_E4, NOTE_G4, NOTE_A4, NOTE_A4, REST,\n  NOTE_A4, NOTE_B4, NOTE_C5, NOTE_C5, REST,\n  NOTE_C5, NOTE_D5, NOTE_B4, NOTE_B4, REST,\n  NOTE_A4, NOTE_G4, NOTE_A4, REST,\n  \n  NOTE_E4, NOTE_G4, NOTE_A4, NOTE_A4, REST,\n  NOTE_A4, NOTE_C5, NOTE_D5, NOTE_D5, REST,\n  NOTE_D5, NOTE_E5, NOTE_F5, NOTE_F5, REST,\n  NOTE_E5, NOTE_D5, NOTE_E5, NOTE_A4, REST,\n  \n  NOTE_A4, NOTE_B4, NOTE_C5, NOTE_C5, REST,\n  NOTE_D5, NOTE_E5, NOTE_A4, REST,\n  NOTE_A4, NOTE_C5, NOTE_B4, NOTE_B4, REST,\n  NOTE_C5, NOTE_A4, NOTE_B4, REST,\n  //End of Repeat\n  \n  NOTE_E5, REST, REST, NOTE_F5, REST, REST,\n  NOTE_E5, NOTE_E5, REST, NOTE_G5, REST, NOTE_E5, NOTE_D5, REST, REST,\n  NOTE_D5, REST, REST, NOTE_C5, REST, REST,\n  NOTE_B4, NOTE_C5, REST, NOTE_B4, REST, NOTE_A4,\n  \n  NOTE_E5, REST, REST, NOTE_F5, REST, REST,\n  NOTE_E5, NOTE_E5, REST, NOTE_G5, REST, NOTE_E5, NOTE_D5, REST, REST,\n  NOTE_D5, REST, REST, NOTE_C5, REST, REST,\n  NOTE_B4, NOTE_C5, REST, NOTE_B4, REST, NOTE_A4\n};\n\n////note duration of Two Tigers, 2 is half a beat, 1 is a beat.\nconst static int tempo[] = { \n  8, 8, 4, 8, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 4, 8,\n  \n  8, 8, 4, 8, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 4, 8,\n  \n  8, 8, 4, 8, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 8, 4, 8,\n  \n  8, 8, 4, 8, 8,\n  4, 8, 4, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 4, 4,\n  \n  4, 8,\n  //Repeat of First Part\n  8, 8, 4, 8, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 4, 8,\n  \n  8, 8, 4, 8, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 4, 8,\n  \n  8, 8, 4, 8, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 8, 4, 8,\n  \n  8, 8, 4, 8, 8,\n  4, 8, 4, 8,\n  8, 8, 4, 8, 8,\n  8, 8, 4, 4,\n  //End of Repeat\n  \n  4, 8, 4, 4, 8, 4,\n  8, 8, 8, 8, 8, 8, 8, 8, 4,\n  4, 8, 4, 4, 8, 4,\n  8, 8, 8, 8, 8, 2,\n  \n  4, 8, 4, 4, 8, 4,\n  8, 8, 8, 8, 8, 8, 8, 8, 4,\n  4, 8, 4, 4, 8, 4,\n  8, 8, 8, 8, 8, 2\n};\n\nPwmOut buzzer(PA_1);\nstatic int BPM = 80;  \n\nstatic void silence() \n{\n    buzzer.write(0.0f); // silence!\n}\n\n\nint main()\n{\n    printf(\"This is MAPP PlayMusic-2-Tigers running on Mbed OS %d.%d.%d.\\n\", MBED_MAJOR_VERSION, MBED_MINOR_VERSION, MBED_PATCH_VERSION);\n    \n    //Play music\n    buzzer.resume();\n    int noteDuration;\n\n    int nsize = sizeof(Caribbean) / sizeof(int);\n    for (int thisNote = 0; thisNote < nsize; thisNote++)\n    {\n         noteDuration = 900 / tempo[thisNote];//a beat for 0.9 second\n\n        buzzer.period_us(1000000/(Caribbean[thisNote]));\n        buzzer.write(0.80f); \n        // after half the length of this tone, we silence\n        thread_sleep_for(noteDuration / 2);\n        silence();\n\n        //after the full length of this tone, call next note \n        thread_sleep_for(noteDuration); \n        \n    }\n    // we're done! just finish this note and silence\n    thread_sleep_for(noteDuration / 2);  \n    silence();   \n    buzzer.suspend();\n\n    while (1);\n\n}\n\n\n","MAPP Lab\\PWM_0.75.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\nint main()\n{\n\n    printf(\"System core clock is: %d \\n\", SystemCoreClock);\n\n    //enable GPIOA clock\n    RCC->APB2ENR |= 0x04;\n    \n    //Configure GPIO pin : PA7, Alternate Function Output, Push-Pull: CNF[1:0] = [1,0], output speed 10MHz: MODE[1:0]= [0,1]\n    GPIOA->CRL |= 0x90000000; //bit 31 - bit 28: 1001b\n    GPIOA->CRL &= 0x9FFFFFFF; \n    \n    //set up TIM3\n    RCC->APB1ENR |= 0x02;   //enable TIM3 clock\n    TIM3->PSC = 60 - 1;     //divide by 60\n    TIM3->ARR = 240 - 1;    //divide by 240\n    TIM3->CNT = 0;          \n    TIM3->CCMR1 = 0x6000;           //bit 14 : bit 12 = 110, PWM mode 1 for channel 2\n    TIM3->CCER |= 0x0010;           //bit 4 (CC2E) = 1, enable output for channle 2\n    TIM3->CCR2 = 180;           //pulse width 75%\n    TIM3->CR1 |= 1;                 //enable timer\n\n    printf(\"TIM3 PWM is started.\\n\");\n  \n    while (true);\n\n    \n}//main\n","MAPP Lab\\Single7Seg.cpp":"//Single7Seg.cpp\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n#define WAIT_TIME_MS 1000\n\n#define SEVEN_SEGMENT_MASK 0x000000FF //PORT B0: PB_7 - PB_0, for 7 Seg display\n#define SEVEN_SEGMENT_RESET 0x00000000 \n\nPortOut sevenSegmentPort(PortB, SEVEN_SEGMENT_MASK);\n\n//Port C: PC_11 - PC_8 connect to DIG3 - DIG0\nDigitalOut sevenSegmentDIG0(PC_8);\nDigitalOut sevenSegmentDIG1(PC_9);\nDigitalOut sevenSegmentDIG2(PC_10);\nDigitalOut sevenSegmentDIG3(PC_11);\n\nint main()\n{\n    printf(\"This is MAPP Single7Seg running on Mbed OS %d.%d.%d.\\n\", MBED_MAJOR_VERSION, MBED_MINOR_VERSION, MBED_PATCH_VERSION);\n    //reset\n    sevenSegmentPort = SEVEN_SEGMENT_RESET;\n    sevenSegmentDIG0= 0;\n    sevenSegmentDIG1= 0;\n    sevenSegmentDIG2= 0;\n    sevenSegmentDIG3= 0;\n    thread_sleep_for(WAIT_TIME_MS);\n\n    while (true)\n    {\n    \t// enable DIG0\n    \tsevenSegmentDIG0= 1;  \n\n        //display 0\n        sevenSegmentPort = 0b00111111;\n\n    }\n}\n","MAPP Lab\\Single7Seg_Loop.cpp":"//Single7Seg_Loop.cpp\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n#define WAIT_TIME_MS 1000\n\n#define SEVEN_SEGMENT_MASK 0x000000FF //PORT B0: PB_7 - PB_0, for 7 Seg display\n#define SEVEN_SEGMENT_RESET 0x00000000 \n\nPortOut sevenSegmentPort(PortB, SEVEN_SEGMENT_MASK);\n\n//Port C: PC_11 - PC_8 connect to DIG3 - DIG0\nDigitalOut sevenSegmentDIG0(PC_8);\nDigitalOut sevenSegmentDIG1(PC_9);\nDigitalOut sevenSegmentDIG2(PC_10);\nDigitalOut sevenSegmentDIG3(PC_11);\n\nDigitalIn button(PC_13);\n\nunsigned char press = 0;\nunsigned char LedData[] = {0x3F, 0x06, 0x5B, 0x4F, 0x66, 0x6D, 0x7D, 0x07, 0x7F, 0x67, 0x77, 0x7c, 0x39, 0x5E, 0x79, 0x71};\n\nint main()\n{\n    printf(\"This is MAPP Single7Seg_Loop running on Mbed OS %d.%d.%d.\\n\", MBED_MAJOR_VERSION, MBED_MINOR_VERSION, MBED_PATCH_VERSION);\n    //reset\n    sevenSegmentPort = SEVEN_SEGMENT_RESET;\n    sevenSegmentDIG0= 0;\n    sevenSegmentDIG1= 0;\n    sevenSegmentDIG2= 0;\n    sevenSegmentDIG3= 0;\n    thread_sleep_for(WAIT_TIME_MS);\n\n    // enable DIG0\n    sevenSegmentDIG0 = 1;\n\n    while (true)\n    {\n        if (press == 0)\n        {\n            //display from 0 to F\n            for (int i = 0; i < 16; i++) \n            {\n                sevenSegmentPort = LedData[i]; \n\n                thread_sleep_for(WAIT_TIME_MS);\n\n            }\n        }\n        else\n        {\n            //display from F to 0\n            for (int i = 15; i >= 0; i--) \n            {\n                sevenSegmentPort = LedData[i]; \n\n                thread_sleep_for(WAIT_TIME_MS);\n\n            }\n        }\n        \n\n        while (button.read() == 1); //wait for the button press\n\n        //clear the display\n        sevenSegmentPort = SEVEN_SEGMENT_RESET;\n        thread_sleep_for(WAIT_TIME_MS);\n        \n        press ++; \n        press %= 2; \n        \n    }\n}\n","MAPP Lab\\SystemTickDelays.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\nDigitalOut led_PB14(PB_14);\n\nvoid systick_delay_ms (int n);\n\nint main()\n{\n    printf(\"System core clock is: %d \\n\", SystemCoreClock);\n   \n    while (true)\n    {\n        systick_delay_ms (1000); //delay 1s\n\n        led_PB14 = ! led_PB14;\n\n    }\n    \n}\n\nvoid systick_delay_ms (int n)\n{\n    int i;\n    //configure SysTick\n    SysTick->LOAD = 72000;   //reload with number of clocks per ms,\n                            //N = delay x SYSCLK = 0.001 x 72MHz = 72000\n    SysTick->VAL = 0;       //clear current value register\n    SysTick->CTRL = 0x05;   //Enable the Timer,  no interrupt, use system clock\n\n    for (i = 0; i < n; i++)\n    {\n        while ((SysTick->CTRL & 0x10000) == 0);  //wait until the COUNTFLAG is set\n    }\n\n    SysTick->CTRL = 0; //stop the timer (Enable = 0)\n}","MAPP Lab\\SystemTickInterrupt.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\nDigitalOut led_PB14(PB_14);\n\nvoid SysTick_Handler(void)\n{  \n    led_PB14 = !led_PB14;  \n   \n}\n\nint main()\n{\n    printf(\"System core clock is: %d \\n\", SystemCoreClock);\n    led_PB14 = 1;\n\n    __disable_irq();        //global disable IRQs\n\n    //configure SysTick\n    SysTick->LOAD = 14400000 - 1;   //reload with number of clocks per 200ms,\n                            //N = delay x SYSCLK = 0.2 x 72MHz = 14400000\n    SysTick->VAL = 0;       //clear current value register\n   \n    NVIC_SetPriority(SysTick_IRQn,  0);\n    HAL_NVIC_EnableIRQ( SysTick_IRQn );\n\n    NVIC_SetVector(SysTick_IRQn, (uint32_t)&SysTick_Handler);\n\n    __enable_irq();          //global enable IRQs\n   \n    SysTick->CTRL = 0x07;   //Enable the Timer,  interrupt, use system clock\n\n   \n    while (true);\n\n}\n","MAPP Lab\\SystemTickLEDBlinking.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\nDigitalOut led_PB14(PB_14);\n\nint main()\n{\n    printf(\"System core clock is: %d \\n\", SystemCoreClock);\n\n    //configure SysTick\n    SysTick->LOAD = 14400000 - 1;   //reload with number of clocks per 200ms,\n                            //N = delay x SYSCLK = 0.2 x 72MHz = 14400000\n    SysTick->VAL = 0;       //clear current value register\n    SysTick->CTRL = 0x05;   //Enable the Timer,  no interrupt, use system clock\n\n   \n    while (true)\n    {\n       if(SysTick->CTRL & 0x10000)\n            led_PB14 = ! led_PB14;\n\n    }  \n}\n","MAPP Lab\\SystemTickTest.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n\n\nint main()\n{\n     printf(\"System core clock is: %d \\n\", SystemCoreClock);\n    //Configure SysTick\n    SysTick->LOAD = 72000; //delay 0.001 sec: N = delay x SYSCLK = 0.001 x 72MHz = 72000\n    SysTick->VAL = 0; //clear current value register\n    SysTick->CTRL = 0x05;        //enable it, no interrupt, use system clock\n   \n    while ((SysTick->CTRL & 0x10000) == 0);  //wait until the COUNTFLAG is set\n    \n    SysTick->CTRL = 0; //Stop the timer, Enable = 0\n    \n    printf(\"SysTick value register value is: %d \\n\", SysTick->VAL);\n   \n\n    while (1);\n    \n}\n","MAPP Lab\\Test_ADC.cpp":"/* Test_ADC.cpp\n * mbed Microcontroller Library\n * Copyright (c) 2019 ARM Limited\n * SPDX-License-Identifier: Apache-2.0\n */\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n#define WAIT_TIME_MS_0 50 \n#define WAIT_TIME_MS_1 500\n\nAnalogIn varResistor(PA_0);\n\nuint16_t voltage_Code = 0;  //read the ADC code\nfloat voltage_Volts = 0.0;  //read the voltage in volts\nfloat voltage_Ref = 0.0;    //read the current voltage ref value\nfloat voltage_data = 0.0;   //read the voltage data: [0, 1]\n\nint main()\n{\n    printf(\"This is the modified bare metal example running on Mbed OS %d.%d.%d.\\n\", MBED_MAJOR_VERSION, MBED_MINOR_VERSION, MBED_PATCH_VERSION);\n    \n    varResistor.set_reference_voltage(3.3);\n    voltage_Ref = varResistor.get_reference_voltage();\n    printf (\"The Voltage Ref is: %f \\n\", voltage_Ref);\n\n   // while (true)\n    {\n        voltage_Volts = varResistor.read_voltage();\n        printf (\"The Voltage is: %5.3f \\n\", voltage_Volts);\n        voltage_data = varResistor.read();\n        printf (\"The Voltage data in [0,1] is: %5.3f \\n\", voltage_data);\n\n        voltage_Code = varResistor.read_u16();\n        printf (\"The normalized 16-bit value is: %#x \\n\", voltage_Code);\n        voltage_Code = voltage_Code >> 4;\n        printf (\"The original ADC value is: %#x \\n\", voltage_Code);\n        voltage_Code = voltage_Code >> 4;\n        printf (\"The upper 8-bit of ADC value is: %#x \\n\", voltage_Code);\n\n        thread_sleep_for(WAIT_TIME_MS_0);\n    }\n\n    return 0;\n}\n","MAPP Lab\\TIM2TimerInterrupt.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\nDigitalOut led_PB14(PB_14);\n\nvoid TIM2_IRQHandler()\n{\n    //Clear TIM2 update interrupt flag.\n    TIM2->SR &= ~TIM_SR_UIF;\n   \n    led_PB14 = !led_PB14;   //toggle LED PB14\n}\n\nint main()\n{\n    printf(\"System core clock is: %d \\n\", SystemCoreClock);\n   \n    __disable_irq();    //global disable IRQ\n    \n    //Enable the TIM2 clock.\n    RCC->APB1ENR |= RCC_APB1ENR_TIM2EN;      //enable TIM2 clock\n    \n    //Make sure the timer's \"counter\" is off.\n     TIM2->CR1 &= ~TIM_CR1_CEN;\n\n    //Reset the peripheral.\n    RCC->APB1RSTR |= (RCC_APB1RSTR_TIM2RST);\n    RCC->APB1RSTR &= ~(RCC_APB1RSTR_TIM2RST);\n\n    TIM2->PSC = 7200 - 1;   //divided by 7200\n    TIM2->ARR = 10000 - 1;  //count from 0 - 9999, total 10000 counts\n    TIM2->CNT = 0;          //clear timer counter\n           \n    //Send an update event to reset the timer and apply settings.\n    TIM2->EGR |= TIM_EGR_UG;\n\n    //Enable TIM2 interrupts and set priority.\n    NVIC_EnableIRQ(TIM2_IRQn);\n    NVIC_SetPriority(TIM2_IRQn, 0);\n\n    __enable_irq();     //global enable IRQ\n\n    NVIC_SetVector(TIM2_IRQn, (uint32_t)&TIM2_IRQHandler); //load the ISR\n\n    //Clear TIM2_IRQn update interrupt,\n    TIM2->SR &= ~TIM_SR_UIF;\n\n    //Enable the hardware interrupt.\n    TIM2->DIER |= TIM_DIER_UIE;\n\n     //Enable the timer.\n     TIM2->CR1 |= TIM_CR1_CEN;\n    \n    while(1)\n        __WFI();  //wait for interrupt\n\n    return EXIT_SUCCESS;\n  \n}\n","MAPP Lab\\TIM2TimerLEDBlinking.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\nDigitalOut led_PB14(PB_14);\n\nint main()\n{\n\n    printf(\"System core clock is: %d \\n\", SystemCoreClock);\n\n    //configure TIM2\n    RCC->APB1ENR |= 1;      //enable TIM2 clock\n    TIM2->PSC = 7200 - 1;   //divided by 7200\n    TIM2->ARR = 10000 - 1;  //count from 0 - 9999, total 10000 counts\n    TIM2->CNT = 0;          //clear timer counter\n    TIM2->CR1 = 1;          //enable TIM2\n     \n    while (true)\n    {\n       while (!(TIM2->SR & 1)); //wait until UIF is set\n       \n       TIM2->SR &= ~1;          //clear UIF\n\n       led_PB14 = !led_PB14;   //toggle LED PB14\n\n    }  \n}\n","MAPP Lab\\TwoLEDsBlinking.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n#define WAIT_TIME_MS_0 500 \n#define WAIT_TIME_MS_1 1500\n\nDigitalOut led0(PB_14);\nDigitalOut led1(PB_15);\n\nint main()\n{\n    while (true)            //repeat\n    {\n        led0 = 1;                           //turn on LED 0\n        led1 = 0;                           //turn off LED 1\n        thread_sleep_for(WAIT_TIME_MS_0);   //delay for 500ms\n        led0 = 0;                           //turn off LED 0\n        led1 = 1;                           //turn on LED 1\n        thread_sleep_for(WAIT_TIME_MS_0);   //delay for 500ms\n    }\n}\n","MAPP Lab\\TwoLEDsOn.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n#define WAIT_TIME_MS_0 500 \n#define WAIT_TIME_MS_1 1500\n\nDigitalOut led0(PB_14);\nDigitalOut led1(PB_15);\n\nint main()\n{\n    while (true)            //repeat\n    {\n        led0 = 1;                           //turn on LED 0\n        led1 = 0;                           //turn off LED 1\n        thread_sleep_for(1);   //delay for 500ms\n        led0 = 0;                           //turn off LED 0\n        led1 = 1;                           //turn on LED 1\n        thread_sleep_for(1);   //delay for 500ms\n    }\n}\n","MAPP Lab\\TwoLEDsOnOff.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n#define WAIT_TIME_MS_0 500 \n#define WAIT_TIME_MS_1 1500\n\nBusOut leds(PB_14, PB_15);\n\nint main()\n{\n    while (true)            //repeat\n    {\n        leds = 0b00000000;                   //turn off LEDs\n        thread_sleep_for(WAIT_TIME_MS_0);   //delay for 500ms\n       \n        leds = 0b00000011;                  //turn on LEDs\n        thread_sleep_for(WAIT_TIME_MS_0);   //delay for 500ms\n    }\n}\n","MAPP Lab\\UART2_Echo.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n\n#define UART2_TX    PA_2\n#define UART2_RX    PA_3\n\nvoid UART2_init (void);\nvoid UART2_write (int ch);\nchar UART2_read (void);\n\nunsigned char message_send[] = \"Hello!\\n\";\n\nint main(void)\n{\n    char chData;\n    int i;\n  \n    UART2_init();\n    for (i = 0; i < 7; i++)\n    {\n        UART2_write(message_send[i]); //send 1 char\n    }\n    \n    while (1) \n    {\n       chData = UART2_read();\n       UART2_write(chData);\n    }\n}\n\n//Initialize UART2\nvoid UART2_init (void)\n{\n    //enable the clocks\n    RCC->APB2ENR |= 0x05;   //enable GPIOA clock and AFIO clock\n    RCC->APB1ENR |= 0x20000; //enable UART2 clock\n\n    //configure PA_2 for UART2 TX\n    GPIOA->CRL &= 0xFFFFF0FF;   //clear the CNF2[1:0] and MODE2[1:0]\n    GPIOA->CRL |= 0x0900;    //set PA_2 as: AF output push-pull, 10MHz\n    //configure PA_3 for UART2 RX\n    GPIOA->CRL &= 0xFFFF0FFF;   //clear the CNF3[1:0] and MODE3[1:0]\n    GPIOA->CRL |= 0x8000;    //set PA_3 as: Input Pull-up/down\n    GPIOA->ODR &= 0xFFFFFFF7;      //clear the bit ODR3 for PA_3\n    GPIOA->ODR |= 0x0008;      //set bit ODR3 to set PA_3: Input Pull-up\n    \n    USART2->BRR = 0x0EA6;   //SYSCLK = 72MHz, APB1 = 36MHz, oversampling by 16 and Baud rate 9600bps\n    USART2->CR1 = 0x000C;   //enable TX and RX\n    USART2->CR2 = 0x0000;   //1 stop bit\n    USART2->CR3 = 0x0000;   //no hardware flow control\n    USART2->CR1 |= 0x2000; //enable USART\n\n    //printf(\"CRL is: %0x \\n\", GPIOA->CRL);\n    //printf (\"ODR is: %0x \\n\", GPIOA->ODR);\n    //printf(\"UART2 BRR is:%0x \\n\", USART2->BRR);\n}\n\n//write a char to UART2\nvoid UART2_write (int ch)\n{\n    while (!(USART2->SR & 0x0080)); //wait until TX buffere empty\n    USART2->DR = (ch & 0xFF);\n    \n}\n\n//read a char from UART2\nchar UART2_read (void)\n{\n    while (!(USART2->SR & 0x0020)); //wait until char arrives\n    return USART2->DR;\n\n}","MAPP Lab\\UART2_Echo_0.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n\n#define UART2_TX    PA_2\n#define UART2_RX    PA_3\n\nvoid UART2_init (void);\nvoid UART2_write (int ch);\nchar UART2_read (void);\n\nunsigned char message_send[] = \"Hello!\\n\";\n\nint main(void)\n{\n    char chData;\n    int i;\n  \n    UART2_init();\n    for (i = 0; i < 7; i++)\n    {\n        UART2_write(message_send[i]); //send 1 char\n    }\n    \n    while (1) \n    {\n       chData = UART2_read();\n       UART2_write(chData);\n    }\n}\n\n//Initialize UART2\nvoid UART2_init (void)\n{\n    //enable the clocks\n    RCC->APB2ENR |= 0x05;   //enable GPIOA clock and AFIO clock\n    RCC->APB1ENR |= 0x20000; //enable UART2 clock\n\n    //configure PA_2 for UART2 TX\n    GPIOA->CRL &= 0xFFFFF0FF;\n    GPIOA->CRL |= 0x0900;    //AF output push-pull, 10MHz\n    //configure PA_3 for UART2 RX\n    GPIOA->CRL &= 0xFFFF0FFF;\n    GPIOA->CRL |= 0x8000;    //input pull up/down\n    GPIOA->ODR = 0x800C;      //input pull up\n    \n    USART2->BRR = 0x0EA6;   //SYSCLK = 72MHz, APB1 = 36MHz, oversampling by 16 and Baud rate 9600bps\n    USART2->CR1 = 0x000C;   //enable TX and RX\n    USART2->CR2 = 0x0000;   //1 stop bit\n    USART2->CR3 = 0x0000;   //no hardware flow control\n    USART2->CR1 |= 0x2000; //enable USART\n\n    printf(\"CRL is: %0x \\n\", GPIOA->CRL);\n    printf (\"ODR is: %0x \\n\", GPIOA->ODR);\n    printf(\"UART2 BRR is:%0x \\n\", USART2->BRR);\n}\n\n//write a char to UART2\nvoid UART2_write (int ch)\n{\n    while (!(USART2->SR & 0x0080)); //wait until TX buffere empty\n    USART2->DR = (ch & 0xFF);\n    \n}\n\n//read a char from UART2\nchar UART2_read (void)\n{\n    while (!(USART2->SR & 0x0020)); //wait until char arrives\n    return USART2->DR;\n\n}","MAPP Lab\\UART2_Echo_MultipleLines.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n\n#define UART2_TX    PA_2\n#define UART2_RX    PA_3\n\nvoid UART2_init (void);\nvoid UART2_write (int ch);\nchar UART2_read (void);\n\nunsigned char message_send[] = \"Hello!\\n\";\n\nint main(void)\n{\n    char chData;\n    int i;\n  \n    UART2_init();\n    for (i = 0; i < 7; i++)\n    {\n        UART2_write(message_send[i]); //send 1 char\n    }\n    \n    while (1) \n    {\n       chData = UART2_read();\n       if (chData == 0x0A || chData == 0x0D)\n            UART2_write('\\n');\n       else\n            UART2_write(chData);\n    }\n}\n\n//Initialize UART2\nvoid UART2_init (void)\n{\n    //enable the clocks\n    RCC->APB2ENR |= 0x05;   //enable GPIOA clock and AFIO clock\n    RCC->APB1ENR |= 0x20000; //enable UART2 clock\n\n    //configure PA_2 for UART2 TX\n    GPIOA->CRL &= 0xFFFFF0FF;   //clear the CNF2[1:0] and MODE2[1:0]\n    GPIOA->CRL |= 0x0900;    //set PA_2 as: AF output push-pull, 10MHz\n    //configure PA_3 for UART2 RX\n    GPIOA->CRL &= 0xFFFF0FFF;   //clear the CNF3[1:0] and MODE3[1:0]\n    GPIOA->CRL |= 0x8000;    //set PA_3 as: Input Pull-up/down\n    GPIOA->ODR &= 0xFFFFFFF7;      //clear the bit ODR3 for PA_3\n    GPIOA->ODR |= 0x0008;      //set bit ODR3 to set PA_3: Input Pull-up\n    \n    USART2->BRR = 0x0EA6;   //SYSCLK = 72MHz, APB1 = 36MHz, oversampling by 16 and Baud rate 9600bps\n    USART2->CR1 = 0x000C;   //enable TX and RX\n    USART2->CR2 = 0x0000;   //1 stop bit\n    USART2->CR3 = 0x0000;   //no hardware flow control\n    USART2->CR1 |= 0x2000; //enable USART\n\n    //printf(\"CRL is: %0x \\n\", GPIOA->CRL);\n    //printf (\"ODR is: %0x \\n\", GPIOA->ODR);\n    //printf(\"UART2 BRR is:%0x \\n\", USART2->BRR);\n}\n\n//write a char to UART2\nvoid UART2_write (int ch)\n{\n    while (!(USART2->SR & 0x0080)); //wait until TX buffere empty\n    USART2->DR = (ch & 0xFF);\n    \n}\n\n//read a char from UART2\nchar UART2_read (void)\n{\n    while (!(USART2->SR & 0x0020)); //wait until char arrives\n    return USART2->DR;\n\n}","MAPP Lab\\UART2_Tx.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n\n#define UART2_TX    PA_2\n#define UART2_RX    PA_3\n\nvoid UART2_init (void);\nvoid UART2_write (int ch);\n\nunsigned char message_send[] = \"Hello!\\n\";\n\nint main(void)\n{\n    int i;\n    \n    UART2_init();\n\n    while (1) \n    {\n        for (i = 0; i < 7; i++)\n        {\n            UART2_write(message_send[i]); //send 1 char\n        }\n         thread_sleep_for(100); //delay between messages\n    }\n}\n\n//Initialize UART2\nvoid UART2_init (void)\n{\n    //enable the clocks\n    RCC->APB2ENR |= 0x05;   //enable GPIOA clock and AFIO clock\n    RCC->APB1ENR |= 0x20000; //enable UART2 clock\n\n    //configure PA_2 for UART2 TX\n    GPIOA->CRL &= 0xFFFFF0FF;\n    GPIOA->CRL |= 0x0900;    //AF output push-pull, 10MHz\n    USART2->BRR = 0x0EA6;   //SYSCLK = 72MHz, APB1 = 36MHz, oversampling by 16 and Baud rate 9600bps\n    USART2->CR1 = 0x0008;   //enable TX\n    USART2->CR2 = 0x0000;   //1 stop bit\n    USART2->CR3 = 0x0000;   //no hardware flow control\n    USART2->CR1 |= 0x2000; //enable USART\n\n}\n\n//write a char to UART2\nvoid UART2_write (int ch)\n{\n    while (! (USART2->SR & 0x0080)); //wait until TX buffere empty\n    USART2->DR = (ch & 0xFF);\n    \n}\n","MAPP Lab\\UART_Menu.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n#include \"lcd.h\"\n\n// Maximum number of element the application buffer can contain\n#define MAXIMUM_BUFFER_SIZE    32\n#define UART2_TX    PA_2\n#define UART2_RX    PA_3\n\n#define DISPLAY_BAR_MASK 0x000000FF //PORT C0: PC_0 - PC_7\n#define DISPLAY_BAR_RESET 0x00000000 \n\nPortOut displayBarPort(PortC, DISPLAY_BAR_MASK);\n\nPwmOut buzzer(PA_1);\nPwmOut relay(PA_6);\nPwmOut motor(PA_7);\n\n// Create a DigitalOutput object to toggle an LED\n//PB_14-> send data, PB_15-> receive data\nstatic DigitalOut led_PB14(PB_14);\nstatic DigitalOut led_PB15(PB_15);\n\n\n\n// Create a BufferedSerial object with a default baud rate.\n//PA_2: TX, PA_3: RX\nstatic BufferedSerial serial_port(UART2_TX, UART2_RX);\n\n//1 for buzzer, 2 for motor, 3 for relay, 4 for led bar\nunsigned char nTest = 0;\n\n // Application buffer to send the data\nchar bufRx[MAXIMUM_BUFFER_SIZE] = {0};\nchar bufTx[] = {\"Please select your test:\\n1. Buzzer\\n2. Motor\\n3. Relay\\n4. LED Bar\\nYour selection is: \"};\nchar bufError[] = {\"\\nNot supported! Please try again!\\n\\n\"};\nchar bufTest[2] = {0, '\\0'};\nchar bufLCD[] = {\"Start testing \"};\nchar bufBuzzer[] = {\"Buzzer\"};\nchar bufMotor[] = {\"Motor\"};\nchar bufRelay[] = {\"Relay\"};\nchar bufLEDBar[] = {\"LED Bar\"};\nchar bufTestDone[] = {\"\\nTest done!\\n\\n\"};\n\nuint32_t sendMsgToPC (char msg[], int size)\n{\n    uint32_t numRet = 0;\n    numRet = serial_port.write(msg, size); \n    if (numRet) \n    {\n        // Toggle the LED.\n        led_PB14 = !led_PB14;\n        \n        thread_sleep_for(50);\n\n    }\n    return numRet;\n}\n\nint main(void)\n{\n    lcd_init();\t\t\t\t\t// Initialise LCD module\n    lcd_write_cmd(0x80);\t\t// Move cursor to line 1 position 1\n   \n    displayBarPort = DISPLAY_BAR_RESET;\n\n    // Set desired properties (9600-8-N-1).\n    serial_port.set_baud(9600);\n    serial_port.set_format(\n        /* bits */ 8,\n        /* parity */ BufferedSerial::None,\n        /* stop bit */ 1\n    );\n\n   \n\n    unsigned char nCount = 0;   //totoal number of char received and displayed on LCD, 1 line of LCD is 20 chars\n    unsigned char nLine = 1;    //start with 1st line\n\n    if (uint32_t num1 = serial_port.write(bufTx, sizeof(bufTx))) \n    {\n        // Toggle the LED.\n        led_PB14 = !led_PB14;\n        \n        thread_sleep_for(50);\n    \n    }\n\n    while (1) \n    {\n           \n            if (uint32_t num2 = serial_port.read(bufRx, sizeof(bufRx))) \n            {\n                // Toggle the LED.\n                led_PB15 = !led_PB15;\n                \n                //lcd_write_cmd(0x01);\n                //lcd_write_data(bufRx[0]); \t\t// write to LCD\n                \n                if (bufRx[0] >= '1' && bufRx[0] <= '4') \n                {\n                    //1 or 2 or 3 or 4 is selected\n                    bufTest[0] = bufRx[0];\n                    nTest = std::atoi(bufTest);\n                    serial_port.write(bufRx, 1); //echo back to PC\n                }\n                else \n                {\n                    //selection is not supported\n                    sendMsgToPC(bufError, sizeof (bufError));  //send the error message\n                    sendMsgToPC(bufTx, sizeof (bufTx));     //ask user to select again\n                    continue;\n                    \n                }\n              \n                thread_sleep_for(50);\n            }\n\n            lcd_write_cmd(0x01); \t\t// clear LCD\n            for (int k = 0; k < sizeof(bufLCD); k++)\n                lcd_write_data(bufLCD[k]); \t\t// write to LCD\n            \n            lcd_write_cmd(0xC0); \t\t// move to 2nd line\n\n            switch (nTest)\n            {\n                case 1:\n                        //test buzzer\n                        for (int k = 0; k < sizeof(bufBuzzer); k++)\n                            lcd_write_data(bufBuzzer[k]); \t\t// write to LCD\n                        buzzer.resume();\n                        buzzer.period_ms(5);\n                        buzzer.write(0.80f);\n\n                        thread_sleep_for(2000);\n                        buzzer.suspend();\n\n                        break;\n                case 2: \n                        //test motor\n                        for (int k = 0; k < sizeof(bufMotor); k++)\n                            lcd_write_data(bufMotor[k]); \t\t// write to LCD\n                        motor.resume();\n                        motor.period_ms(1000);\n                        motor.write(0.50f);\n\n                        thread_sleep_for(4000);\n                        motor.suspend();\n\n                        break; \n                case 3:\n                        //test relay\n                        for (int k = 0; k < sizeof(bufRelay); k++)\n                            lcd_write_data(bufRelay[k]); \t\t// write to LCD\n                        relay.resume();\n                        relay.period_ms(1000);\n                        relay.write(0.50f);\n\n                        thread_sleep_for(4000);\n                        relay.suspend();\n\n                        break;\n                case 4:\n                        //test LED bar\n                        for (int k = 0; k < sizeof(bufLEDBar); k++)\n                            lcd_write_data(bufLEDBar[k]); \t\t// write to LCD\n                            \n                            for (int l = 0; l < 4; l++)\n                            {\n                                displayBarPort = DISPLAY_BAR_MASK;\n                                thread_sleep_for(500);\n                                displayBarPort = DISPLAY_BAR_RESET;\n                                thread_sleep_for(500);\n\n                            }\n                            \n\n                        break;\n                default: \n                        break;\n\n            }\n\n            sendMsgToPC(bufTestDone, sizeof(bufTestDone));\n\n            if (uint32_t num1 = serial_port.write(bufTx, sizeof(bufTx))) \n            {\n                // Toggle the LED.\n                led_PB14 = !led_PB14;\n                \n                thread_sleep_for(50);\n            \n            }\n\n\n            thread_sleep_for(50);\n    }\n}\n","MAPP Lab\\UART_Send.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n// Create a DigitalOutput object to toggle an LED\nstatic DigitalOut led(PB_14);\n\n// Create a BufferedSerial object with a default baud rate.\n//PA_2: TX, PA_3: RX\nstatic BufferedSerial serial_port(PA_2, PA_3);\n\nint main(void)\n{\n    // Set desired properties (9600-8-N-1).\n    serial_port.set_baud(9600);\n    serial_port.set_format(\n        /* bits */ 8,\n        /* parity */ BufferedSerial::None,\n        /* stop bit */ 1\n    );\n\n    // Application buffer to send the data\n    char bufTx[] = {\"This is a test!\\n\"};\n\n    while (1) \n    {\n            if (uint32_t num = serial_port.write(bufTx, sizeof(bufTx)))\n            {\n                // Toggle the LED.\n                led = !led;\n                \n                thread_sleep_for(1000);\n            \n            }\n    }\n}\n","MAPP Lab\\UART_Send_n_Receive-test-I.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n#include \"lcd.h\"\n\n// Maximum number of element the application buffer can contain\n#define MAXIMUM_BUFFER_SIZE    32\n#define UART2_TX    PA_2\n#define UART2_RX    PA_3\n\n// Create a DigitalOutput object to toggle an LED\n//PB_14-> send data, PB_15-> receive data\nstatic DigitalOut led_PB14(PB_14);\nstatic DigitalOut led_PB15(PB_15);\n\n// Create a BufferedSerial object with a default baud rate.\n//PA_2: TX, PA_3: RX\nstatic BufferedSerial serial_port(UART2_TX, UART2_RX);\n\nint main(void)\n{\n    lcd_init();\t\t\t\t\t// Initialise LCD module\n    lcd_write_cmd(0x80);\t\t// Move cursor to line 1 position 1\n\n    // Set desired properties (9600-8-N-1).\n    serial_port.set_baud(9600);\n    serial_port.set_format(\n        /* bits */ 8,\n        /* parity */ BufferedSerial::None,\n        /* stop bit */ 1\n    );\n\n    // Application buffer to send the data\n    char bufRx[MAXIMUM_BUFFER_SIZE] = {0};\n    char bufTx[] = {\"This is a test!\\n\"};\n    unsigned char nCount = 0;   //totoal number of char received and displayed on LCD, 1 line of LCD is 20 chars\n    unsigned char nLine = 1;    //start with 1st line\n\n    if (uint32_t num1 = serial_port.write(bufTx, sizeof(bufTx))) \n    {\n        // Toggle the LED.\n        led_PB14 = !led_PB14;\n        \n        thread_sleep_for(50);\n    \n    }\n    while (1) \n    {\n           \n            if (uint32_t num2 = serial_port.read(bufRx, sizeof(bufRx))) \n            {\n                // Toggle the LED.\n                led_PB15 = !led_PB15;\n                \n                lcd_write_data(bufRx[0]); \t\t// write to LCD\n                nCount ++;\n                if (nCount >= 20)\n                {\n                    if (nLine == 1)\n                    {\n                        lcd_write_cmd(0xC0);\t\t// Move cursor to line 2 position 1\n                        nLine ++;\n                        nCount = 0;\n                    }  \n                    else\n                    {\n                        lcd_Clear();\n                        lcd_write_cmd(0x80);\t\t// Move cursor to line 1 position 1\n                        nLine = 1;\n                        nCount = 0;\n                    }                  \n                }\n                //\n               // lcd_write_data(0x31); \t\t// write \"1\" to LCD\n                //\n\n                // Echo the input back to the terminal.\n                bufRx[num2] = '\\n';\n                serial_port.write(bufRx, num2+1);\n                thread_sleep_for(50);\n            }\n    }\n}\n","MAPP Lab\\UART_Send_n_Receive-test-II.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n#include \"lcd.h\"\n\n// Maximum number of element the application buffer can contain\n#define MAXIMUM_BUFFER_SIZE    32\n#define UART2_TX    PA_2\n#define UART2_RX    PA_3\n\n// Create a DigitalOutput object to toggle an LED\n//PB_14-> send data, PB_15-> receive data\nstatic DigitalOut led_PB14(PB_14);\nstatic DigitalOut led_PB15(PB_15);\n\n// Create a BufferedSerial object with a default baud rate.\n//PA_2: TX, PA_3: RX\nstatic BufferedSerial serial_port(UART2_TX, UART2_RX);\n\nint main(void)\n{\n    lcd_init();\t\t\t\t\t// Initialise LCD module\n    lcd_write_cmd(0x80);\t\t// Move cursor to line 1 position 1\n\n    // Set desired properties (9600-8-N-1).\n    serial_port.set_baud(9600);\n    serial_port.set_format(\n        /* bits */ 8,\n        /* parity */ BufferedSerial::None,\n        /* stop bit */ 1\n    );\n\n    printf(\"GPIOA CRL is: %0x \\n\", GPIOA->CRL);\n    printf(\"GPIOA ODR is: %0x \\n\", GPIOA->ODR);\n    printf(\"UART2 BRR is:%0x \\n\", USART2->BRR);\n\n    // Application buffer to send the data\n    char bufRx[MAXIMUM_BUFFER_SIZE] = {0};\n    char bufTx[] = {\"This is a test!\\n\"};\n    unsigned char nCount = 0;   //totoal number of char received and displayed on LCD, 1 line of LCD is 20 chars\n    unsigned char nLine = 1;    //start with 1st line\n\n    if (uint32_t num1 = serial_port.write(bufTx, sizeof(bufTx))) \n    {\n        // Toggle the LED.\n        led_PB14 = !led_PB14;\n        \n        thread_sleep_for(50);\n    \n    }\n    while (1) \n    {\n           \n            if (uint32_t num2 = serial_port.read(bufRx, sizeof(bufRx))) \n            {\n                // Toggle the LED.\n                led_PB15 = !led_PB15;\n                \n                lcd_write_data(bufRx[0]); \t\t// write to LCD\n                nCount ++;\n                if (nCount >= 20)\n                {\n                    if (nLine == 1)\n                    {\n                        lcd_write_cmd(0xC0);\t\t// Move cursor to line 2 position 1\n                        nLine ++;\n                        nCount = 0;\n                    }  \n                    else\n                    {\n                        lcd_Clear();\n                        lcd_write_cmd(0x80);\t\t// Move cursor to line 1 position 1\n                        nLine = 1;\n                        nCount = 0;\n                    }                  \n                }\n                \n                // Echo the input back to the terminal.\n                if (bufRx[num2-1] == 0x0A || bufRx[num2-1] == 0x0D)\n                {\n                    bufRx[num2] = '\\n';\n                    serial_port.write(bufRx, num2+1);\n                }\n                else \n                {\n                    serial_port.write(bufRx, num2);\n                }\n                \n               \n                thread_sleep_for(50);\n            }\n    }\n}\n","MAPP Lab\\UART_Send_n_Receive.cpp":"\n#undef __ARM_FP\n\n#include \"mbed.h\"\n#include \"lcd.h\"\n\n// Maximum number of element the application buffer can contain\n#define MAXIMUM_BUFFER_SIZE    32\n#define UART2_TX    PA_2\n#define UART2_RX    PA_3\n\n// Create a DigitalOutput object to toggle an LED\n//PB_14-> send data, PB_15-> receive data\nstatic DigitalOut led_PB14(PB_14);\nstatic DigitalOut led_PB15(PB_15);\n\n// Create a BufferedSerial object with a default baud rate.\n//PA_2: TX, PA_3: RX\nstatic BufferedSerial serial_port(UART2_TX, UART2_RX);\n\nint main(void)\n{\n    lcd_init();\t\t\t\t\t// Initialise LCD module\n    lcd_write_cmd(0x80);\t\t// Move cursor to line 1 position 1\n\n    // Set desired properties (9600-8-N-1).\n    serial_port.set_baud(9600);\n    serial_port.set_format(\n        /* bits */ 8,\n        /* parity */ BufferedSerial::None,\n        /* stop bit */ 1\n    );\n\n    // Application buffer to send the data\n    char bufRx[MAXIMUM_BUFFER_SIZE] = {0};\n    char bufTx[] = {\"This is a test!\\n\"};\n    unsigned char nCount = 0;   //totoal number of char received and displayed on LCD, 1 line of LCD is 20 chars\n    unsigned char nLine = 1;    //start with 1st line\n\n    if (uint32_t num1 = serial_port.write(bufTx, sizeof(bufTx))) \n    {\n        // Toggle the LED.\n        led_PB14 = !led_PB14;\n        \n        thread_sleep_for(50);\n    \n    }\n    while (1) \n    {\n           \n            if (uint32_t num2 = serial_port.read(bufRx, sizeof(bufRx))) \n            {\n                // Toggle the LED.\n                led_PB15 = !led_PB15;\n                \n                lcd_write_data(bufRx[0]); \t\t// write to LCD\n                nCount ++;\n                if (nCount >= 20)\n                {\n                    if (nLine == 1)\n                    {\n                        lcd_write_cmd(0xC0);\t\t// Move cursor to line 2 position 1\n                        nLine ++;\n                        nCount = 0;\n                    }  \n                    else\n                    {\n                        lcd_Clear();\n                        lcd_write_cmd(0x80);\t\t// Move cursor to line 1 position 1\n                        nLine = 1;\n                        nCount = 0;\n                    }                  \n                }\n                \n                // Echo the input back to the terminal.\n                if (bufRx[num2-1] == 0x0A || bufRx[num2-1] == 0x0D)\n                {\n                    bufRx[num2] = '\\n';\n                    serial_port.write(bufRx, num2+1);\n                }\n                else \n                {\n                    serial_port.write(bufRx, num2);\n                }\n                \n               \n                thread_sleep_for(50);\n            }\n    }\n}\n","MAPP Lab\\Utilities\\keypad.h":"// file : keypad.h \n\nextern char getkey(void); // waits for a keypress and returns the ascii code\n\n","MAPP Lab\\Utilities\\keypad_utilities.cpp":"/*\n * File:   keypad_utilities.cpp\n *\n */\n\n\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n\n//declare the Keypad Data input pins as an object of BusIn\n//You can have up to 16 pins in a Bus.\n//The order of pins in the constructor is the reverse order of the pins in the byte order. \n//If you have BusIn(a,b,c,d,e,f,g,h) \n//then the order of bits in the byte would be hgfedcba \n//with a being bit 0, b being bit 1, c being bit 2 and so on.\nBusIn Keypad_Data(PB_8, PB_9, PB_10, PB_11);\n\nDigitalIn Keypad_DA (PB_13); //74C922 DA output\n\nconst unsigned char lookupTable[] = {'1', '2','3','F','4','5','6','E','7','8','9','D','A','0','B','C'};\n\n//----- Function to obtained wait for key press and returns its ASCII value\n\nchar getkey(void)\n{\t\n    // Optional: set mode as PullUp/PullDown/PullNone/OpenDrain\n    Keypad_Data.mode(PullNone);\n\n    char keycode = 0;\n     \n    while (Keypad_DA == 0);      //wait for key to be pressed\n\n    // read the bus and mask out bits not being used\n    keycode = Keypad_Data & Keypad_Data.mask();    \n\n    // output to COM port for debugging\n    printf(\"Key pressed: 0x%04X \\n\", keycode);\n\n    while (Keypad_DA == 1);      //wait for key to be released\n\n    //Look up table to find the key pressed\n    return (lookupTable[keycode]);\n    \n}\n","MAPP Lab\\Utilities\\lcd.h":"/*  file : lcd.h \n *\tLCD interface header file\n *\tSee lcd.c for more info\n */\n\n /* intialize the LCD - call before anything else */\nextern void lcd_init(void);\n\n/* write a byte to the LCD in 4 bit mode */\nextern void lcd_write_cmd(unsigned char cmd);\n\n//extern void lcd_write(unsigned char i);\nextern void lcd_write_data(char data);\n\n /* clear the LCD  */\nextern void lcd_Clear(void);","MAPP Lab\\Utilities\\lcd_utilities.cpp":"/*\n * File:   lcd utilities.cpp\n *\n */\n#undef __ARM_FP\n\n#include \"mbed.h\"\n#include \"lcd.h\"\t// Include file is located in the project directory\n\n#define DISPLAY_LCD_MASK 0x00000F00 //PORT A1: PA_15 : PA_8, 4-bit mode, using PA_11 : PA_8\n#define DISPLAY_LCD_RESET 0x00000000\n\nPortOut lcdPort(PortA, DISPLAY_LCD_MASK);\n//DigitalOut LCD_RS(PA_14);   //  Register Select on LC\nDigitalOut LCD_RS(PC_7);   //  Register Select on LC\nDigitalOut LCD_EN(PA_12);   //  Enable on LCD controller\n//DigitalOut LCD_WR(PA_13);   //  Write on LCD controller\nDigitalOut LCD_WR(PC_6);   //  Write on LCD controller\n\nvoid lcd_strobe(void);\n\n//--- Function for writing a command byte to the LCD in 4 bit mode -------------\n\nvoid lcd_write_cmd(unsigned char cmd)\n{\n    unsigned char temp2;\n    int tempLCDPort = 0;\n\n    LCD_RS = 0;\t\t\t\t\t// Select LCD for command mode\n    wait_us(40);\t\t\t\t// 40us delay for LCD to settle down\n    temp2 = cmd;\n    temp2 = temp2 >> 4;\t\t\t// Output upper 4 bits, by shifting out lower 4 bits\n    temp2 = temp2 & 0x0F;\n                        \t\t// Output to PORTD which is connected to LCD\n    tempLCDPort = (int) temp2;\n    tempLCDPort =  tempLCDPort << 8;\n    tempLCDPort = tempLCDPort & 0x00000F00;\n    lcdPort = tempLCDPort;\n\n\n    wait_us(10000);\t\t\t// 10ms - Delay at least 1 ms before strobing\n    lcd_strobe();\n    \n\twait_us(10000);\t\t\t// 10ms - Delay at least 1 ms after strobing\n\n    temp2 = cmd;\t\t\t\t// Re-initialise temp2 \n    temp2 = temp2 & 0x0F;\t\t// Mask out upper 4 bits\n    \n    tempLCDPort = (int) temp2;\n    tempLCDPort =  tempLCDPort << 8;\n    tempLCDPort = tempLCDPort & 0x00000F00;\n    lcdPort = tempLCDPort;\n\n    wait_us(10000);\t\t\t// 10ms - Delay at least 1 ms before strobing\n    lcd_strobe();\n    wait_us(10000);\t\t\t// 10ms - Delay at least 1 ms before strobing\n\n}\n\n//---- Function to write a character data to the LCD ---------------------------\n\nvoid lcd_write_data(char data)\n{\n  \tchar temp1;\n    int tempLCDPort = 0;\n\n    LCD_RS = 1;\t\t\t\t\t// Select LCD for data mode\n    wait_us(40);\t\t\t\t// 40us delay for LCD to settle down\n\n    temp1 = data;\n    temp1 = temp1 >> 4;\n    temp1 = temp1 & 0x0F;\n\n    tempLCDPort = (int) temp1;\n    tempLCDPort =  tempLCDPort << 8;\n    tempLCDPort = tempLCDPort & 0x00000F00;\n    lcdPort = tempLCDPort;\n\n\twait_us(10000); \n   \tLCD_RS = 1;\n    wait_us(10000);\t\t\t//_-_ strobe data in\n\n    lcd_strobe();\n    wait_us(10000);\n\n    temp1 = data;\n    temp1 = temp1 & 0x0F;\n    tempLCDPort = (int) temp1;  \n    tempLCDPort =  tempLCDPort << 8;\n    tempLCDPort = tempLCDPort & 0x00000F00;\n    lcdPort = tempLCDPort;\n\n    wait_us(10000);\n\tLCD_RS = 1;\n    wait_us(10000); \t\t\t//_-_ strobe data in\n\n    lcd_strobe();\t\n    wait_us(10000);\n}\n\n\n//-- Function to generate the strobe signal for command and character----------\n\nvoid lcd_strobe(void)\t\t\t// Generate the E pulse\n{\n    LCD_EN = 1;\t\t\t\t\t// E = 0\n    wait_us(10000);\t\t\t// 10ms delay for LCD_EN to settle\n    LCD_EN = 0;\t\t\t\t\t// E = 1\n    wait_us(10000);\t\t\t// 10ms delay for LCD_EN to settle\n}\n\n\n//---- Function to initialise LCD module ----------------------------------------\nvoid lcd_init(void)\n{\n    lcdPort = DISPLAY_LCD_RESET;\t\t\t\t// lcd port (portA, PA8 - PA15) is connected to LCD data pin\n    LCD_EN = 0;\n    LCD_RS = 0;\t\t\t\t\t// Select LCD for command mode\n    LCD_WR = 0;\t\t\t\t\t// Select LCD for write mode\n   \n    // Delay a total of 1 s for LCD module to\n\t// finish its own internal initialisation\n\n    thread_sleep_for(1000);\n\n    /* The data sheets warn that the LCD module may fail to initialise properly when\n       power is first applied. This is particularly likely if the Vdd\n       supply does not rise to its correct operating voltage quickly enough.\n\n       It is recommended that after power is applied, a command sequence of\n       3 bytes of 30h be sent to the module. This will ensure that the module is in\n       8-bit mode and is properly initialised. Following this, the LCD module can be\n       switched to 4-bit mode.\n    */\n\n    lcd_write_cmd(0x33);\n    lcd_write_cmd(0x32);\n      \n    lcd_write_cmd(0x28);\t\t// 001010xx   Function Set instruction\n    \t\t\t\t\t\t\t// DL=0 :4-bit interface,N=1 :2 lines,F=0 :5x7 dots\n   \n    lcd_write_cmd(0x0E);\t\t// 00001110   Display On/Off Control instruction\n    \t\t\t\t\t\t\t// D=1 :Display on,C=1 :Cursor on,B=0 :Cursor Blink on\n   \n    lcd_write_cmd(0x06);\t\t// 00000110   Entry Mode Set instruction\n    \t\t\t\t\t\t\t// I/D=1 :Increment Cursor position\n   \t\t\t\t\t\t\t\t// S=0 : No display shift\n   \n    lcd_write_cmd(0x01);\t\t// 00000001 Clear Display instruction\n \n    thread_sleep_for(20);\t\t\t// 20 ms delay\n\n}\n\nvoid lcd_Clear(void)\n{\n    lcd_write_cmd(0x01);\t\t// 00000001 Clear Display instruction\n \n    thread_sleep_for(20);\t\t\t// 20 ms delay\n\n}","MAPP Lab\\Utilities\\music.h":"// file : music.h\n\nextern void music(void); // play a scale\n\nextern void tone(int freq, int duration); // play a note\n\n// duration = 4 for quarter note\n// duration = 8 for eight note\n\n// predefined frequencies\n#define NOTE_B0  31\n#define NOTE_C1  33\n#define NOTE_CS1 35\n#define NOTE_D1  37\n#define NOTE_DS1 39\n#define NOTE_E1  41\n#define NOTE_F1  44\n#define NOTE_FS1 46\n#define NOTE_G1  49\n#define NOTE_GS1 52\n#define NOTE_A1  55\n#define NOTE_AS1 58\n#define NOTE_B1  62\n#define NOTE_C2  65\n#define NOTE_CS2 69\n#define NOTE_D2  73\n#define NOTE_DS2 78\n#define NOTE_E2  82\n#define NOTE_F2  87\n#define NOTE_FS2 93\n#define NOTE_G2  98\n#define NOTE_GS2 104\n#define NOTE_A2  110\n#define NOTE_AS2 117\n#define NOTE_B2  123\n#define NOTE_C3  131\n#define NOTE_CS3 139\n#define NOTE_D3  147\n#define NOTE_DS3 156\n#define NOTE_E3  165\n#define NOTE_F3  175\n#define NOTE_FS3 185\n#define NOTE_G3  196\n#define NOTE_GS3 208\n#define NOTE_A3  220\n#define NOTE_AS3 233\n#define NOTE_B3  247\n#define NOTE_C4  262\n#define NOTE_CS4 277\n#define NOTE_D4  294\n#define NOTE_DS4 311\n#define NOTE_E4  330\n#define NOTE_F4  349\n#define NOTE_FS4 370\n#define NOTE_G4  392\n#define NOTE_GS4 415\n#define NOTE_A4  440\n#define NOTE_AS4 466\n#define NOTE_B4  494\n#define NOTE_C5  523\n#define NOTE_CS5 554\n#define NOTE_D5  587\n#define NOTE_DS5 622\n#define NOTE_E5  659\n#define NOTE_F5  698\n#define NOTE_FS5 740\n#define NOTE_G5  784\n#define NOTE_GS5 831\n#define NOTE_A5  880\n#define NOTE_AS5 932\n#define NOTE_B5  988\n#define NOTE_C6  1047\n#define NOTE_CS6 1109\n#define NOTE_D6  1175\n#define NOTE_DS6 1245\n#define NOTE_E6  1319\n#define NOTE_F6  1397\n#define NOTE_FS6 1480\n#define NOTE_G6  1568\n#define NOTE_GS6 1661\n#define NOTE_A6  1760\n#define NOTE_AS6 1865\n#define NOTE_B6  1976\n#define NOTE_C7  2093\n#define NOTE_CS7 2217\n#define NOTE_D7  2349\n#define NOTE_DS7 2489\n#define NOTE_E7  2637\n#define NOTE_F7  2794\n#define NOTE_FS7 2960\n#define NOTE_G7  3136\n#define NOTE_GS7 3322\n#define NOTE_A7  3520\n#define NOTE_AS7 3729\n#define NOTE_B7  3951\n#define NOTE_C8  4186\n#define NOTE_CS8 4435\n#define NOTE_D8  4699\n#define NOTE_DS8 4978\n\n","MAPP Lab\\Utilities\\music_utilities.cpp":"#undef __ARM_FP\n\n#include \"mbed.h\"\n#include \"music.h\"\n\n\n// notes in the melody:\nint melody[] = {NOTE_C3, NOTE_D3, NOTE_E3, NOTE_F3, NOTE_G3, NOTE_A3, NOTE_B3, NOTE_C4};\n \n// note durations: 4 = quarter note, 8 = eighth note, etc.:\nint noteDurations[] = {4, 4, 4, 4, 4, 4, 4, 4};\n// notes in the melody:\nint melody2[] = {NOTE_C4, NOTE_G3, NOTE_G3, NOTE_GS3, NOTE_G3, 0, NOTE_B3, NOTE_C4};\n \n// note durations: 4 = quarter note, 8 = eighth note, etc.:\nint noteDurations2[] = {4, 8, 8, 4, 4, 4, 4, 4};\n//Set Port A, GPIO Pin 1 (PA_1) as digitial out put pin\n//declare a buzzer as a DigitalOut object by passing PA_1 as the initialition parameter \nDigitalOut buzzerMusic(PA_1); \n\nvoid tone(int freq, int duration) \n{\n    int k;\n    long period, count;\n\n    duration = 1000/duration;\n    if (freq == 0) \n        thread_sleep_for(duration); // rest\n    else \n    {\n        period = 1000000 / (long) freq;\n        period = period / 2;\n\n\n        count = (long) duration * 1000 / period;\n\n        for (k = 0; k < count; k++) //Determines duration of tone\n        {\n            wait_us(period);\n            buzzerMusic = !buzzerMusic; //Invert logic level at RC0\n        }\n        thread_sleep_for(5);\n    }\n    return;\n}\n\n\nvoid music(void) \n{\n   int i;\n\n    buzzerMusic = 0;\n\t\n    for(i=0; i<8; i++) \n         tone(melody[i],noteDurations[i]);\n            \n    return;\n}\n\n","MAPP Lab\\Utilities\\seg7.h":"#undef __ARM_FP\n\n\n#include \"mbed.h\"\n\nextern void update(unsigned char val[], int size)\t; // update the above variable\n\n\nextern char convert(char outchar); // converts the outchar to 7 segment display pattern","MAPP Lab\\Utilities\\seg7_utilities.cpp":"#undef __ARM_FP\n\n#include \"mbed.h\"\n#include \"seg7.h\"\n\nchar convert(char digit)\n{\n    char leddata;\n\n\tif(digit==0)leddata=0b00111111;\n\tif(digit==1)leddata=0b00000110;\n\tif(digit==2)leddata=0b01011011;\n\tif(digit==3)leddata=0b01001111;\n\tif(digit==4)leddata=0b01100110;\n\tif(digit==5)leddata=0b01101101;\n\tif(digit==6)leddata=0b01111101;\n\tif(digit==7)leddata=0b00000111;\n\tif(digit==8)leddata=0b01111111;\n\tif(digit==9)leddata=0b01101111;\n    return(leddata);\n}\n\nvoid update(unsigned char val[], int size)\t\t\t//Function to adjust DIG values\n{\n    if (size != 4)\n        return;\n\n\tif(val[0]>=10)\n\t{\n\t\tval[1]=val[1]+1;\n\t\tval[0]=0;\n\t}\n\n\tif(val[1]>=10)\n\t{\n\t\tval[2]=val[2]+1;\n\t\tval[1]=0;\n\t}\n\tif(val[2]>=10)\n\t{\n\t\tval[3]=val[3]+1;\n\t\tval[2]=0;\n\t}\n\tif(val[3]>=10)\n\t{\n\t\tval[3]=0;\n\t}\n\n    return;\n}\n","NUCLEO_F103RB\\main.cpp":"/* mbed Microcontroller Library\n * Copyright (c) 2019 ARM Limited\n * SPDX-License-Identifier: Apache-2.0\n */\n#undef __ARM_FP\n\n#include \"mbed.h\"\n\n#define WAIT_TIME_MS_0 200 \n#define WAIT_TIME_MS_1 1500\n\nDigitalOut led1(LED1);\nDigitalIn button(PC_13);\n\nint main()\n{\n    printf(\"This is the modified bare metal Led blinky example running on Mbed OS %d.%d.%d.\\n\", MBED_MAJOR_VERSION, MBED_MINOR_VERSION, MBED_PATCH_VERSION);\n    int nCount = 0;\n\n    while (true)\n    {\n        if (button.read() == 0)\n        { \n            // Button is pressed\n            // wait for button is released\n            while (button.read() == 0);\n\n            nCount ++;\n            nCount %= 2;\n\n        }\n\n        led1 = !led1;\n        if (nCount == 0)\n            thread_sleep_for(WAIT_TIME_MS_0);\n        else\n             thread_sleep_for(WAIT_TIME_MS_1);\n    }\n}\n","NUCLEO_F103RB\\mbed_config.h":"/*\n * mbed SDK\n * Copyright (c) 2017 ARM Limited\n *\n * Licensed under the Apache License, Version 2.0 (the \"License\");\n * you may not use this file except in co NT                                        1                                                            // set by library:rtos-api\n#define MBED_CONF_TARGET_BOOT_STACK_SIZE                                  0x1000                                                       // set by target:Target\n#define MBED_CONF_TARGET_CONSOLE_UART                                     1                                                            // set by target:Target\n#define MBED_CONF_TARGET_CUSTOM_TICKERS                                   1                                                            // set by target:Target\n#define MBED_CONF_TARGET_DEEP_SLEEP_LATENCY                               4                                                            // set by target:MCU_STM32\n//#define MBED_CONF_TARGET_DEFAULT_ADC_VREF                                 NAN                                                          // set by target:Target\n#define MBED_CONF_TARGET_DEFAULT_ADC_VREF                                 3.3\n#define MBED_CONF_TARGET_GPIO_RESET_AT_INIT                               0                                                            // set by target:MCU_STM32\n#define MBED_CONF_TARGET_INIT_US_TICKER_AT_BOOT                           1                                                            // set by target:MCU_STM32\n#define MBED_CONF_TARGET_INTERNAL_FLASH_UNIFORM_SECTORS                   1                                                            // set by target:Target\n#define MBED_CONF_TARGET_LPTICKER_LPTIM_CLOCK                             1                                                            // set by target:MCU_STM32\n#define MBED_CONF_TARGET_LPUART_CLOCK_SOURCE                              USE_LPUART_CLK_LSE|USE_LPUART_CLK_PCLK1|USE_LPUART_CLK_PCLK3 // set by target:MCU_STM32\n#define MBED_CONF_TARGET_LSE_AVAILABLE                                    1                                                            // set by target:MCU_STM32\n#define MBED_CONF_TARGET_MPU_ROM_END                                      0x0fffffff                                                   // set by target:Target\n#define MBED_CONF_TARGET_RTC_CLOCK_SOURCE                                 USE_RTC_CLK_LSE_OR_LSI                                       // set by target:MCU_STM32\n#define MBED_CONF_TARGET_TICKLESS_FROM_US_TICKER                          0                                                            // set by target:Target\n#define MBED_CONF_TARGET_XIP_ENABLE                                       0                                                            // set by target:Target\n#define MBED_CRC_TABLE_SIZE                                               16                                                           // set by library:drivers\n#define MBED_STACK_DUMP_ENABLED                                           0                                                            // set by library:platform\n#define MBED_TRACE_COLOR_THEME                                            0                                                            // set by library:mbed-trace\n#define MEM_ALLOC                                                         malloc                                                       // set by library:mbed-trace\n#define MEM_FREE                                                          free                                                         // set by library:mbed-trace\n\n#endif\n","NUCLEO_F103RB\\README.md":"![](./resources/official_armmbed_example_badge.png)\n# Bare metal blinky Mbed OS example\n\nThis example shows how to achieve memory optimizations in Mbed OS. Starting with a blinky application, the example illustrates how to enable the bare metal profile and further memory optimizations.\n\nYou can build this project with all supported [Mbed OS build tools](https://os.mbed.com/docs/mbed-os/latest/tools/index.html). However, this example project specifically refers to the command-line interface tool [Arm Mbed CLI](https://github.com/ARMmbed/mbed-cli#installing-mbed-cli).\n\n1. Install Mbed CLI.\n1. From the command-line, import the example: `mbed import mbed-os-example-blinky-baremetal`\n1. Change the current directory to where the project was imported.\n\n## Application functionality\n\nThe `main()` function toggles the state of a digital output connected to an LED on the board.\n\n## Building and running\n\n1. Connect a USB cable between the USB port on the target and the host computer.\n1. Run the following command to build the example project, program the microcontroller flash memory, and open a serial terminal:\n\n   ```\n   $ mbed compile -m <TARGET> -t <TOOLCHAIN> --flash --sterm\n   ```\n\n\nYour PC may take a few minutes to compile your code.\n\nThe binary is located at `./BUILD/<TARGET>/<TOOLCHAIN>/mbed-os-example-blinky-baremetal.bin`.\n\nAlternatively, you can manually copy the binary to the target, which gets mounted on the host computer through USB.\n\nDepending on the target, you can build the example project with the `GCC_ARM`, `ARM` or `IAR` toolchain. After installing Arm Mbed CLI, run the command below to determine which toolchain supports your target:\n\n```\n$ mbed compile -S\n```\n\n## Expected output \n\nThe LED on your target turns on and off every 500 milliseconds, and the serial terminal shows an output similar to: \n\n```\n--- Terminal on /dev/tty.usbmodem21102 - 9600,8,N,1 ---\nThis is the bare metal blinky example running on Mbed OS 99.99.99.\n``` \n\n## Configuring the application\n\n### The bare metal profile\n\nThe bare metal profile is a configuration of Mbed OS that excludes the RTOS, as well as other features. We designed it specifically for ultraconstrained devices because it gives you more control over the system. For more details, please see [the bare metal documentation](https://os.mbed.com/docs/mbed-os/latest/reference/mbed-os-bare-metal.html)\n\nTo build with the bare metal profile, the application configuration file must contain:\n\n```json\n{\n    \"requires\": [\"bare-metal\"]\n}\n```\n\n### Futher optimizations\nSome of the configurations shown below are already set by default in `targets/targets.json` and `platform/mbed_lib.json`.\n#### Linking with smaller C libraries\n\nBoth the `ARM` and `GCC_ARM` toolchains support optimized versions of their C standard libraries, microlib and newlib-nano. We recommend using them with the bare metal profile.\n\nTo build with the smaller C libraries, modify the application configuration file:\n\n```json\n{\n    \"target_overrides\": {\n        \"*\": {\n            \"target.c_lib\": \"small\"\n        }\n    }\n}\n```\n\nThe build system reverts to the standard C library if support for the small C library is not enabled for your target. You can find more information [here]( https://github.com/ARMmbed/mbed-os-5-docs/blob/development/docs/program-setup/bare_metal/c_small_libs.md).\n\n#### Using Mbed minimal printf library\n\nMbed OS offers a smaller `printf()` alternative. The [minimal printf](https://github.com/ARMmbed/mbed-os/blob/master/platform/source/minimal-printf/README.md) library implements a subset of the `v/s/f/printf` function family, and you can disable floating points to further reduce code size.\n\nTo build with the minimal printf library and disable floating points printing, you need to modify the application configuration file:\n\n```json\n{\n    \"target_overrides\": {\n        \"*\": {\n            \"target.printf_lib\": \"minimal-printf\",\n            \"platform.minimal-printf-enable-floating-point\": false\n        }\n    }\n}\n```\n\nFurther optimizations are possible. For more details, please see the minimal printf README.\n\n#### Using a minimal console\n\nIf your application only needs unbuffered I/O operations, you can save additional memory by using a configuration of the platform library, which removes file handling functionality from the [system I/O retarget code](https://github.com/ARMmbed/mbed-os/blob/master/platform/source/mbed_retarget.cpp).\n\nTo build with the minimal console functionality, modify the application configuration file:\n\n```json\n{\n    \"target_overrides\": {\n        \"*\": {\n            \"platform.stdio-minimal-console-only\": true\n        }\n    }\n}\n```\n\n#### Memory comparison\n\nThe below table shows the result for the blinky bare metal application compiled with the release profile on K64F for the GCC_ARM toolchain.\n\nThe baseline configuration used is the blinky bare metal application built with the standard C library.\n\nMbed OS release: mbed-os-6.0.0-alpha-2\n\n|Standard C lib|Small C lib|Minimal printf|Minimal console|RAM|Flash|\n| :---:        | :---:     | :---:        | :---:         | :---: | :---: |\n| X            |           |              |               | 0 | 0 |\n|              | X         |              |               | -2,592 | -28,581 |\n|              | X         | X            |               | -2,592 | -29,918 |\n|              | X         | X            | X             | -2,592 | -30,810 |\n\n## Troubleshooting \n\nIf you have problems, you can review the [documentation](https://os.mbed.com/docs/latest/tutorials/debugging.html) for suggestions on what could be wrong and how to fix it. \n\n## Related links \n\n- [Mbed OS bare metal](https://os.mbed.com/docs/mbed-os/latest/reference/mbed-os-bare-metal.html).\n- [Mbed OS configuration](https://os.mbed.com/docs/latest/reference/configuration.html). \n- [Mbed OS serial communication](https://os.mbed.com/docs/latest/tutorials/serial-communication.html). \n- [Mbed boards](https://os.mbed.com/platforms/).\n\n### License and contributions\n\nThe software is provided under the Apache-2.0 license. Contributions to this project are accepted under the same license. Please see [contributing.md](./CONTRIBUTING.md) for more information.\n\nThis project contains code from other projects. The original license text is included in those source files. They must comply with our license guide.\   const dl = !!(fs && lb && lb.ok && lb.sources && fs.sources && fs.sources.length === lb.sources.length && fs.sources.every((s, i) => s.text === lb.sources[i].text));
  out.push({ ok: dl && !stale, label: 'Flash \u2192 Download (F8): latest build is on the board', hint: 'After a successful build: Flash \u2192 Download. The board restarts with the new program.' });
  return out;
}

/* ---------------- window ---------------- */
const Coach = {
  w: null, tab: 'p1', results: {}, timer: null, testEnd: null,
  open(tab) {
    if (tab) this.tab = tab;
    if (this.w) { this.w.restore(); this.w.focus(); this.render(); return; }
    const dh = WM.desk.clientHeight, dw = WM.desk.clientWidth;
    this.w = WM.open('coach', { title: 'Lab Test Practice \u2013 ET1010 MAPP', icon: I.lab, w: 600, h: Math.min(dh - 40, 640), x: Math.max(10, Math.min(dw - 1170, 470)), y: Math.max(10, dh - Math.min(dh - 40, 640) - 10), cls: 'coachwin', onClosed: () => { this.w = null; clearInterval(this.timer); } });

    const head = h('div.co-head', null, tabs, h('div.co-timer', null, this.clockEl, timerBtn));

    if (this.tab === 'help') body.append(this.helpView());

  partDone(p) { return p.tasks.every(t => this.results[t.id] && this.results[t.id].ok); },
  tickClock() {
    if (!this.clockEl) return;
    if (!this.testEnd) { this.clockEl.textContent = ''; return; }
    const ms = this.testEnd - Date.now();
    if (ms <= 0) { this.clockEl.textContent = 'Time is up!'; this.clockEl.classList.add('late'); return; }
    this.clockEl.textContent = '\u23F1 ' + Math.floor(ms / 60000) + ':' + String(Math.floor(ms / 1000) % 60).padStart(2, '0') + ' left';
  },
  partView(p) {
    this.procEl = h('div.co-proc');
    this.curPart = p;
    const wrap = h('div', null, h('h2', { text: p.title }), h('p.co-intro', { text: p.intro }), h('h3', { text: 'Procedure (checked automatically)' }), this.procEl, h('h3', { text: 'Demonstrate to the "lecturer"' }));
    this.refreshProc();
    for (const t of p.tasks) {
      const res = h('div.co-res');
      const r = this.results[t.id];
      if (r) this.paintRes(res, r);
      const btn = h('button.btn.primary.sm', { text: '\u25B6 Check on board' });
      btn.onclick = () => this.runTest(t, res, btn);
      const hint = h('details.co-more', null, h('summary', { text: 'Hint' }), h('div', { text: t.hint }));
      const sol = SOL[t.id] || (t.id === 'p3a' || t.id === 'p3b' ? SOL.p3 : null);
      const solEl = sol ? h('details.co-more', null, h('summary', { text: 'Model answer (try first!)' }), h('pre.co-code', { text: sol })) : null;
      wrap.append(h('div.co-task', null, h('div.co-ttitle', null, h('span.co-ticon', { html: r ? (r.ok ? I.ok : I.fail) : I.pending }), h('span', { text: t.title })), h('div.co-trow', null, btn, h('span.co-note', { text: 'Runs the program that is currently downloaded on the board, presses the switches/keys for you and watches the outputs.' })), res, hint, solEl));
    }
    return wrap;
  },
  refreshProc() {
    if (!this.procEl || !this.curPart || this.tab === 'help') return;
    const checks = procChecks(this.curPart);
    const html = checks.map(c => '<div class="co-pi ' + (c.ok ? 'ok' : c.warn ? 'warn' : 'todo') + '"><span>' + (c.ok ? I.ok : c.warn ? I.warnT : I.pending) + '</span><div><div>' + escH(c.label) + '</div>' + (c.ok ? '' : '<div class="co-ph">' + escH(c.hint) + '</div>') + '</div></div>').join('');
    if (this.procEl.innerHTML !== html) this.procEl.innerHTML = html;
  },
  async runTest(t, res, btn) {
    const img = G.App.flashImage;
    res.innerHTML = '';
    if (!img) { this.paintRes(res, { ok: false, msg: 'There is no program on the board. Build (F7) and Flash \u2192 Download (F8) first.' }); return; }
    btn.disabled = true; btn.textContent = 'Testing\u2026';
    await new Promise(r => setTimeout(r, 30));
    let r;
    try { r = { ok: true, msg: TESTS[t.id](img) }; }
    catch (e) { r = { ok: false, msg: e instanceof Fail ? e.message : 'Test error: ' + e.message }; if (!(e instanceof Fail)) console.error(e); }
    r.prog = G.App.flashInfo; r.time = Date.now();
    const lb = G.UV.lastBuild;
    if (r.ok && G.App.flashSnap && lb && lb.sources && !(G.App.flashSnap.sources || []).every((s, i) => lb.sources[i] && s.text === lb.sources[i].text)) r.msg += '\n(Note: the board is running an older build than your latest one \u2013 Download again.)';
    this.results[t.id] = r;
    try { localStorage.setItem('mappsim.results', JSON.stringify(this.results)); } catch (e) { }
    btn.disabled = false; btn.textContent = '\u25B6 Check on board';
    this.render();
  },
  paintRes(el, r) {
    el.className = 'co-res ' + (r.ok ? 'ok' : 'bad');
    el.innerHTML = '';
    el.append(h('div.co-rh', { html: (r.ok ? I.ok + ' <b>Correct</b>' : I.fail + ' <b>Not yet</b>') + (r.prog ? ' <span class="co-rp">tested: ' + escH(r.prog) + '</span>' : '') }), h('pre.co-rm', { text: r.msg }));
  },
  helpView() {
    return h('div.co-help', { html: `
<h2>How this simulator works</h2>
<p>This is a practice copy of the lab PC: <b>File Explorer</b>, <b>Keil \u00b5Vision 5</b>, <b>Tera Term</b> and the <b>MAPP Experiment Board</b>. Do every step exactly as in the lab:</p>
<ol>

<li>In \u00b5Vision expand the group <b>NUCLEO_F103RB</b>, right-click <code>main.cpp</code> \u2192 <b>Remove File 'main.cpp'</b> (close its editor tab too).</li>
<li>In File Explorer open <code>MAPP Lab</code>, select the sample (e.g. <code>BlinkLeds.cpp</code>), <b>Ctrl+C</b>, go to <code>NUCLEO_F103RB</code>, <b>Ctrl+V</b>. For LCD/keypad also copy the files from <code>MAPP Lab\\Utilities</code>.</li>
<li>In \u00b5Vision right-click the group \u2192 <b>Add Existing Files to Group 'NUCLEO_F103RB'\u2026</b> \u2192 pick the copied .cpp file(s) \u2192 <b>Add</b> \u2192 <b>Close</b>.</li>
<li>Double-click the file to edit it. <b>F7</b> = Build Target. Double-click an error in Build Output to jump to that line.</li>
<li><b>F8</b> = Flash \u2192 Download. The board restarts with your program. Use the DIP switches, buttons and keypad on the board.</li>
<li>Open a Part tab here and press <b>Check on board</b> \u2013 the "lecturer" runs your downloaded program, flips the switches / presses keys and tells you exactly what is right or wrong.</li>
</ol>
<h3>Board controls</h3>
<ul>

<li><b>Buttons</b> (B1/PC13, PC12, PA15): hold the mouse down to press. Right-click latches a button down.</li>
<li><b>Keypad</b>: click the keys, or type 0\u20139 / A\u2013F while the board window is focused.</li>

<h3>What is simulated</h3>
<p>Your code is really compiled (C/C++ subset of Arm Compiler 6 with the same kind of error messages, include-file lookup and linker errors such as <i>L6218E Undefined symbol</i> and <i>L6200E multiply defined</i>), then run against a pin-level model of the STM32F103RB and the MAPP boards: the LCD is a real HD44780 controller driven by your <code>lcd_utilities.cpp</code> bit by bit, the keypad is a 74C922 encoder, and the 7-segment display uses persistence of vision.</p>

};
function escH(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

G.Coach = Coach; G.CoachTests = TESTS; G.CoachHarness = harness;

/* ===== main.js ===== */
// main.js — desktop, taskbar, app wiring
(function (G) {
'use strict';
const { h, I, WM, msgBox, showMenu } = G;
const FLASH_KEY = 'mappsim.flash.v1';

const events = {
  map: {},
  on(n, f) { (this.map[n] = this.map[n] || []).push(f); },
  emit(n, d) { for (const f of this.map[n] || []) try { f(d); } catch (e) { console.error(e); } },
};

const App = {
  vfs: null, events, machine: null, flashImage: null, flashSnap: null, flashInfo: '',
  compileSnapshot(snap) {
    const incl = snap.incl || {};
    const fs = {
      resolveInclude(name, from) {
        for (const d of [VFS.dirname(from), VFS.dirname(snap.project || from)]) {
          const p = VFS.resolve(d, name);
          for (const k in incl) if (VFS.same(k, p)) return { path: VFS.norm(p), text: incl[k], display: VFS.basename(p) };
        }
        return null;
      }
    };
    const r = G.MappCompiler.buildProgram(snap.sources, fs);
    if (!r.ok) { console.warn('snapshot compile failed', r); return null; }
    return { factory: r.factory };
  },
  describe(snap) {
    const names = snap.sources.map(s => s.name);
    const main = names.find(n => !/_utilities\.cpp$/i.test(n)) || names[0] || 'program';
    const d = new Date(snap.time);
    return main + (names.length > 1 ? ' (+' + (names.length - 1) + ')' : '') + '  \u2022  downloaded ' + [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, '0')).join(':');
  },
  flash(img, snap) {
    this.flashImage = img; this.flashSnap = snap; this.flashInfo = this.describe(Object.assign({}, snap, { time: Date.now() }));
    this.machine.load(img); this.machine.powerOn();
    try { localStorage.setItem(FLASH_KEY, JSON.stringify(Object.assign({}, snap, { flashedAt: Date.now() }))); } catch (e) { }
    events.emit('flash');
  },
  eraseFlash() {
    this.flashImage = null; this.flashSnap = null; this.flashInfo = '';
    this.machine.load(null); this.machine.erase();
    try { localStorage.setItem(FLASH_KEY, 'null'); } catch (e) { }
    events.emit('flash');
  },
  resetBoard() { this.machine.powerOn(); },
  powerChanged(on) {
    if (on) this.machine.powerOn();
    else { this.machine.image && this.machine.powerOn(); this.machine.state = 'off'; }
  },
  openCoach(tab) { G.Coach.open(tab); },
  async resetLab() {
    const r = await msgBox('MAPP', 'Restore fresh copies of all MAPP Programs?\n\nThis deletes every change you made under D:\\MAPP Programs (and any copied Lab folders), exactly like the MAPP icon on the lab PCs.', 'warn', 'yesno');
    if (r !== 'yes') return;
    if (G.UV.w) { G.UV.tabs.slice().forEach(t => { t.saved = t.ed.value; }); await G.UV.closeProject(); }
    for (const w of [...WM.wins.values()]) if (w.id.startsWith('np:')) w.close(true);
    G.seedVFS(this.vfs);
    try { Object.keys(localStorage).filter(k => k.startsWith('mappsim.uv.')).forEach(k => localStorage.removeItem(k)); } catch (e) { }
    this.vfs.changed('D:\\MAPP Programs', 'write');
    G.toast('Fresh copies of MAPP Programs restored');
  },
};

function bootFlash() {
  let snap = null;
  try { snap = JSON.parse(localStorage.getItem(FLASH_KEY) || 'undefined'); } catch (e) { snap = undefined; }
  if (snap === null) { App.machine.erase(); return; }
  if (!snap) {
    // factory board: the template LED blinky (main.cpp) is pre-loaded
    const p = 'D:\\MAPP Programs\\NUCLEO_F103RB\\main.cpp';
    const text = App.vfs.read(p) || (G.MAPP_FILES && G.MAPP_FILES['NUCLEO_F103RB\\main.cpp']) || '';
    snap = { mappsim: 1, time: Date.now(), project: 'D:\\MAPP Programs\\NUCLEO_F103RB\\NUCLEO_F103RB.uvprojx', sources: [{ path: p, name: 'main.cpp', text }], incl: {} };
  }
  const img = App.compileSnapshot(snap);
  if (img) { App.flashImage = img; App.flashSnap = snap; App.flashInfo = App.describe(Object.assign({}, snap, { time: snap.flashedAt || snap.time })); App.machine.load(img); App.machine.powerOn(); }
  else App.machine.erase();
}

function desktop() {
  const desk = h('div#desk');
  const bar = h('div#taskbar');
  const tasks = h('div.tb-tasks');
  const clock = h('div.tb-clock');
  const start = h('button.tb-start', { title: 'Start', html: I.win.replace(/width="16" height="16"/, 'width="22" height="22"') });
  bar.append(start, tasks, clock);
  document.body.append(desk, bar);
  WM.init(desk, tasks);
  const apps = [
    { name: 'This PC', icon: I.pc, run: () => G.openExplorer('C:') },
    { name: 'MAPP Programs', icon: I.folder, run: () => G.openExplorer('D:\\MAPP Programs') },
    { name: 'Keil uVision5', icon: I.uvision, run: () => G.UV.show() },
    { name: 'MAPP Board', icon: I.board, run: () => G.Board.open() },
    { name: 'Tera Term', icon: I.term, run: () => G.TeraTerm.open() },
    { name: 'Lab Test Practice', icon: I.lab, run: () => G.Coach.open() },
    { name: 'MAPP', icon: I.mapp, run: () => App.resetLab(), title: 'Restore fresh copies of MAPP Programs (like the lab PCs)' },
  ];
  const icons = h('div.desk-icons');
  apps.forEach(a => {
    const el = h('div.dicon', { title: a.title || a.name, tabindex: 0 }, h('div.dicon-img', { html: a.icon.replace(/width="16" height="16"/, 'width="40" height="40"') }), h('div.dicon-l', { text: a.name }));
    el.addEventListener('dblclick', a.run);
    el.addEventListener('keydown', e => { if (e.key === 'Enter') a.run(); });
    el.addEventListener('click', () => { icons.querySelectorAll('.dicon.sel').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); });
    icons.append(el);
  });
  desk.append(icons);
  desk.addEventListener('mousedown', e => { if (e.target === desk) icons.querySelectorAll('.dicon.sel').forEach(x => x.classList.remove('sel')); });
  start.addEventListener('pointerdown', e => {
    e.stopPropagation();
    const r = start.getBoundingClientRect();
    showMenu(r.left, r.top, apps.map(a => ({ label: a.name, icon: a.icon, action: a.run })).concat(['-', { label: 'File Explorer', icon: I.explorer, action: () => G.openExplorer('D:\\MAPP Programs') }]), { flipY: r.top });
  });
  const tick = () => { const d = new Date(); let hh = d.getHours(); const ap = hh >= 12 ? 'pm' : 'am'; hh = hh % 12 || 12; clock.innerHTML = hh + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + ap + '<br>' + d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear(); };
  tick(); setInterval(tick, 10000);
}

function boot() {
  App.vfs = new VFS();
  if (!App.vfs.load() || !App.vfs.exists('D:\\MAPP Programs')) G.seedVFS(App.vfs);
  G.App = App;
  App.machine = new G.MappRuntime.Machine();
  App.machine.serialListeners.push(s => G.TeraTerm.write(s));
  desktop();
  bootFlash();
  G.Board.init(App.machine);
  App.vfs.onChange((p, kind) => { if (kind === 'write') G.UV.extChanged && G.UV.extChanged(p); });
  events.on('extwrite', p => G.UV.extChanged(p));
  window.addEventListener('beforeunload', () => { App.vfs.save(); G.UV.saveUiState && G.UV.saveUiState(); });
  // initial layout
  G.Board.open();
  G.Coach.open();
  G.openExplorer('D:\\MAPP Programs');
  window.addEventListener('resize', () => { for (const w of WM.wins.values()) if (w.maximized) { w.el.style.width = WM.desk.clientWidth + 'px'; w.el.style.height = WM.desk.clientHeight + 'px'; } });
}
document.addEventListener('DOMContentLoaded', boot);
G.App = App;
})(window);
